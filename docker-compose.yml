services:
  backend:
    build: .
    container_name: burnout-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PROJECT_NAME=Burnout Risk PoC Backend
      - API_V1_STR=/api/v1
      - PSEUDO_KEY=chiave_segreta_hmac_sanita_privata_demo
      - DATABASE_URL=sqlite:///./burnout.db
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:8080","http://127.0.0.1:3000","http://127.0.0.1:5173"]
      - K_MIN=6
      - RETENTION_MESI=24
      - AVVISI_ORARIO_HR=false
      - COSTO_TURNOVER_DEFAULT=45000.0
    restart: unless-stopped
